name: Check & Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint || true
      - run: npm run build
      - name: Health check
        run: echo "Build passed for commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
